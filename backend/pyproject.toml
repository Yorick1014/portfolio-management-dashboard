[project]
name = "portfolio-management-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for the portfolio management dashboard"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "fastapi[standard]",
    "passlib[bcrypt]",
    "psycopg[binary]",
    "pydantic-settings",
    "python-jose[cryptography]",
    "sqlmodel",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
